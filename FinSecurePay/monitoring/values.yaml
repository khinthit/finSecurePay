# Helm values for kube-prometheus-stack. No password in this file:
# the Gmail App Password lives in the Kubernetes Secret "alertmanager-smtp".
alertmanager:
  alertmanagerSpec:
    secrets: ["alertmanager-smtp"]     # mounted at /etc/alertmanager/secrets/alertmanager-smtp/
  config:
    global:
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_from: "you@gmail.com"
      smtp_auth_username: "you@gmail.com"
      smtp_auth_password_file: "/etc/alertmanager/secrets/alertmanager-smtp/password"
      smtp_require_tls: true
    route:
      receiver: "null"
      group_by: ["alertname"]
      group_wait: 30s
      repeat_interval: 4h
      routes:
        - receiver: "email"
          matchers: ['alertname=~"HighValidationRejectRate|FinSecurePodsUnavailable"']
    receivers:
      - name: "null"
      - name: "email"
        email_configs:
          - to: "you@gmail.com"
            send_resolved: true
