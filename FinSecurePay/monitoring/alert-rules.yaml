apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: finsecure-alerts
  namespace: finsecure
  labels:
    release: monitoring
spec:
  groups:
    - name: finsecure.rules
      rules:
        - alert: HighValidationRejectRate
          expr: |
            sum(rate(finsecure_validations_total{result="rejected"}[2m]))
              / sum(rate(finsecure_validations_total[2m])) > 0.5
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "More than 50% of transactions are being rejected"
            description: "Possible bad client release, attack, or misconfigured limits."
        - alert: FinSecurePodsUnavailable
          expr: kube_deployment_status_replicas_available{namespace="finsecure", deployment="finsecure-pay"} < 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Fewer than 2 FinSecure Pay replicas are available"
