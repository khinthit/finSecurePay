# Helm values for kube-prometheus-stack. No password here:
# the Gmail App Password is in the Kubernetes Secret "alertmanager-smtp".
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    secrets: ["alertmanager-smtp"]     # mounted at /etc/alertmanager/secrets/alertmanager-smtp/
  config:
    global:
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_from: "khinthitthitmaw@gmail.com"
      smtp_auth_username: "khinthitthitmaw@gmail.com"
      smtp_auth_password_file: "/etc/alertmanager/secrets/alertmanager-smtp/password"
      smtp_require_tls: true
    route:
      receiver: "null"
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - receiver: "email"
          matchers: ['alertname=~"HighValidationRejectRate|FinSecurePodsUnavailable"']
    receivers:
      - name: "null"
      - name: "email"
        email_configs:
          - to: "khinthitthitmaw@gmail.com"
            send_resolved: true